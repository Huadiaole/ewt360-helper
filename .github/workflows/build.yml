name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 用户脚本 + 扩展
  extension:
    name: 用户脚本与扩展
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法自检
        run: |
          node --check src/ewt360-helper.user.js
          node --check extension/content.js || true

      - name: 用真源重新生成 content.js 与图标
        run: node extension/tools/build-extension.mjs

      - name: 确认生成结果与仓库提交一致
        run: |
          if ! git diff --quiet -- extension/content.js; then
            echo "::error::extension/content.js 与 src/ewt360-helper.user.js 不同步，请本地跑一次 node extension/tools/build-extension.mjs 并提交"
            git diff --stat -- extension/content.js
            exit 1
          fi
          if ! cmp -s src/ewt360-helper.user.js android/app/src/main/assets/ewt360-helper.user.js; then
            echo "::error::android/app/src/main/assets/ewt360-helper.user.js 与 src 不同步，请把真源复制过去"
            exit 1
          fi

      - name: 打包扩展
        run: |
          cd extension
          zip -r ../ewt360-extension.zip . -x 'tools/*' -x '*.md'

      - uses: actions/upload-artifact@v4
        with:
          name: userscript-and-extension
          path: |
            src/ewt360-helper.user.js
            ewt360-extension.zip

  # ---------------------------------------------------------------------- 安卓 APK
  android:
    name: 安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/EWT360-Helper-${{ github.ref_name }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  # ------------------------------------------------------------------------ 发布
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/userscript-and-extension/ewt360-helper.user.js
            artifacts/userscript-and-extension/ewt360-extension.zip
            artifacts/android-apk/*.apk
